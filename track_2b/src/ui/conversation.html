<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>First Reply · Conversation</title>
<style>
:root{color-scheme:light;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#29322f;background:#f8f9f6}*{box-sizing:border-box}body{margin:0}header{display:flex;justify-content:space-between;align-items:center;padding:18px 28px;border-bottom:1px solid #e4e8e1;background:white}header strong{font-size:17px}header small{color:#738077}main{max-width:820px;margin:auto;padding:28px 24px 210px}#intro{margin:60px 0 36px}h1{font-size:28px;font-weight:600;margin-bottom:12px}.muted{color:#788179;font-size:14px;line-height:1.65}.message{margin:22px 0}.user{background:#eaf0e7;border-radius:16px;padding:16px 20px;margin-left:50px;white-space:pre-wrap;max-height:200px;overflow:auto;line-height:1.6}.assistant{padding:12px 0 22px}h2{font-size:14px;font-weight:600;color:#758275;margin:12px 0}.draft{white-space:pre-wrap;line-height:1.75;font-size:16px}.hint{margin-top:22px;padding-left:14px;border-left:3px solid #bac9aa;color:#58634f;line-height:1.65;font-size:14px}button{font:inherit;border:1px solid #dbe1d5;background:white;color:#40573b;border-radius:8px;padding:8px 12px;cursor:pointer}button:disabled{opacity:.45;cursor:default}.actions{display:flex;gap:10px;margin-top:18px}.actions button{font-size:13px}details{margin-top:20px;color:#6b7768;font-size:13px}summary{cursor:pointer}.why{padding:8px 0;line-height:1.6;overflow-wrap:anywhere}.why p{margin:12px 0}.evidence{white-space:pre-wrap;max-height:240px;overflow:auto;background:#f1f3ec;padding:12px;border-radius:8px}pre{white-space:pre-wrap;font-size:11px;max-height:300px;overflow:auto}.composer-wrap{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(transparent,#f8f9f6 18%);padding:24px 24px 12px}.composer{max-width:772px;margin:auto;background:white;border:1px solid #d6decf;border-radius:16px;box-shadow:0 5px 22px #2637280b;padding:12px 14px}textarea{width:100%;resize:vertical;min-height:74px;max-height:240px;border:0;outline:none;font:inherit;line-height:1.5;color:inherit}.controls{display:flex;gap:10px;align-items:center;justify-content:space-between}.send{background:#3d5636;color:white;border-color:#3d5636}.bottom{max-width:772px;margin:7px auto 0;text-align:center;font-size:11px;color:#87907f}#notice{max-width:772px;margin:0 auto 8px;color:#73542f;font-size:13px;white-space:pre-wrap}#files{font-size:12px;color:#788179;margin-bottom:7px}#status{font-size:12px;color:#6b7768}a{color:#3d5636}#restore{display:none} @media(max-width:600px){header{padding:14px}header small{display:none}main{padding:12px 16px 230px}.composer-wrap{padding-left:12px;padding-right:12px}.user{margin-left:20px}#intro{margin-top:35px}}
</style>
<header><strong>First Reply</strong><small>准备一封值得你审核的首回复</small><button id="restore">返回本轮对话</button></header>
<main>
<section id="intro"><h1>把询盘贴过来，我们一起把回复写好。</h1><p class="muted">可补充客户资料。生成后，继续用自然语言告诉我哪里需要修改。</p><button id="loadCase">填入本轮私密询盘</button><p id="coverage" class="muted"></p></section>
<section id="thread" aria-live="polite"></section>
</main>
<div class="composer-wrap"><div id="notice" role="alert"></div><form class="composer" id="form"><div id="files"></div><textarea id="message" aria-label="询盘或修改指令" placeholder="粘贴询盘；之后可以说：缩短一点，或先核实材料再谈价格。" required></textarea><div class="controls"><div><button type="button" id="attach">＋ 附件</button><input type="file" id="fileInput" multiple hidden><span id="status"></span></div><button class="send" type="submit" id="send">生成首回复 ↑</button></div></form><div class="bottom">草稿需你确认，不会自动发送。文本附件读取内容；图片/PDF 等仅保存，仍标为未读。</div></div>
<script>
const $=s=>document.querySelector(s);let state=null,pendingFiles=[],busy=false;
const storageKey='first-reply-conversation-id';
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
async function api(path,body){const response=await fetch(path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{cache:'no-store'});const value=await response.json();if(!response.ok)throw Error(value.error||'请求未完成');return value}
function why(data){const details=el('details');details.append(el('summary','Why this reply?'));const content=el('div',undefined,'why');content.append(el('p','建议推进：'+data.primary_advance));if(data.parallel_advances.length)content.append(el('p','条件满足时并行：'+data.parallel_advances.map(p=>p.operation+' · '+p.conditions.join('；')).join('\n')));if(data.questions.length)content.append(el('p','这封信问：\n'+data.questions.join('\n')));if(data.company_claims.length){content.append(el('p','可使用的公司条件（不是都写入草稿）：'));for(const f of data.company_claims)content.append(el('div',String(f.value)+' '+(f.unit||'')+'\n条件：'+f.conditions.join('；')+'\n来源：'+f.source_quote,'evidence'))}for(const f of [...data.blockers,...data.warnings])content.append(el('p',f.message+(f.phrase?'\n“'+f.phrase+'”':'')));if(data.sources.length)content.append(el('p','附件：'+data.sources.map(s=>s.name+' · '+(s.status==='read'?'已读取':'尚未读取')).join('；')));const e=el('details');e.append(el('summary','查看原文依据'));e.append(el('div',data.evidence.map(s=>s.text).join('\n\n'),'evidence'));content.append(e);const t=el('details');t.append(el('summary','Technical Details'));t.append(el('pre',JSON.stringify(data.technical,null,2)));content.append(t);details.append(content);return details}
function show(value){state=value;localStorage.setItem(storageKey,state.id);$('#intro').hidden=true;$('#thread').replaceChildren();const entries=state.history;for(let i=0;i<entries.length;i++){const entry=entries[i];if(entry.role==='user'){$('#thread').append(el('div',entry.text,'message user'));continue}const box=el('article',undefined,'message assistant');box.append(el('h2','客户回复草稿'));box.append(el('div',entry.draft||'这次没有生成可展示的草稿。','draft'));if(i===entries.length-1){if(state.hint)box.append(el('div',state.hint,'hint'));const actions=el('div',undefined,'actions');const copy=el('button','复制草稿');copy.type='button';copy.disabled=!state.draft;copy.onclick=async()=>{try{await navigator.clipboard.writeText(state.draft);copy.textContent='已复制'}catch{$('#notice').textContent='复制未完成，请直接选中草稿复制。'}};actions.append(copy);const adopt=el('button',state.adopted?'已采纳这版':'采纳这版');adopt.type='button';adopt.disabled=state.adopted||!state.can_adopt;adopt.onclick=async()=>{setBusy(true);try{show(await api('/conversation/turn',{id:state.id,revision:state.revision,action:'adopt'}))}catch(error){$('#notice').textContent=error.message}finally{setBusy(false)}};actions.append(adopt);box.append(actions);box.append(why(state.why))}$('#thread').append(box)}if(entries.at(-1)?.role==='user'&&state.hint)$('#thread').append(el('div',state.hint,'hint'));$('#send').textContent='修改回复 ↑';$('#restore').style.display='none';requestAnimationFrame(()=>window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}))}
function setBusy(value){busy=value;for(const s of ['#send','#attach','#loadCase','#message'])$(s).disabled=value;$('#status').textContent=value?'正在整理与生成…':''}
$('#loadCase').onclick=async()=>{try{const c=await api('/conversation/case');$('#message').value=c.text;$('#coverage').textContent=c.coverage_note;$('#message').focus()}catch(error){$('#notice').textContent=error.message}};
$('#attach').onclick=()=>$('#fileInput').click();$('#fileInput').onchange=async event=>{try{const files=[...event.target.files];if(files.length+pendingFiles.length>5)throw Error('每轮最多 5 个附件。');for(const file of files){if(file.size>400000)throw Error('单附件最大 400 KB。');const bytes=new Uint8Array(await file.arrayBuffer());let raw='';for(const byte of bytes)raw+=String.fromCharCode(byte);pendingFiles.push({name:file.name,base64:btoa(raw)})}$('#files').textContent=pendingFiles.map(f=>f.name).join(' · ')}catch(error){$('#notice').textContent=error.message}finally{event.target.value=''}};
$('#form').onsubmit=async event=>{event.preventDefault();if(busy)return;const text=$('#message').value.trim();if(!text)return;$('#notice').textContent='';setBusy(true);try{const value=await api(state?'/conversation/turn':'/conversation/start',state?{id:state.id,revision:state.revision,text,files:pendingFiles}:{text,files:pendingFiles});show(value);$('#message').value='';pendingFiles=[];$('#files').textContent=''}catch(error){$('#notice').textContent=error.message}finally{setBusy(false)}};
$('#message').onkeydown=event=>{if((event.ctrlKey||event.metaKey)&&event.key==='Enter')$('#form').requestSubmit()};
const previous=localStorage.getItem(storageKey);if(previous){$('#restore').style.display='block';$('#restore').onclick=async()=>{try{show(await api('/conversation/state?id='+encodeURIComponent(previous)))}catch(error){$('#notice').textContent=error.message}}}
const requested=new URLSearchParams(location.search).get('id');if(requested)api('/conversation/state?id='+encodeURIComponent(requested)).then(show).catch(error=>$('#notice').textContent=error.message);
</script>
</html>
